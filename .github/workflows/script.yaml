on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Test Message'
        required: true
        default: 'World'

name: script

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          MESSAGE: ${{ inputs.message }}
        with:
          script: |
            const script = require('./.github/scripts/test.ts')
            script();
